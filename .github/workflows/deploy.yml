# 교재 p.250~274 — Vite Build & Deployment (GitHub Pages)
# main 브랜치에 push 될 때마다 자동으로 빌드 → 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 뒤쪽 것만 남긴다 (진행 중인 배포는 취소하지 않는다)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 정적 분석 (교재 p.274 — 에러 0 확인)
        run: npx eslint .

      - name: 프로덕션 빌드
        # API 키는 저장소에 커밋하지 않고 GitHub Secret 으로 주입한다.
        # Secret 이 없으면 앱이 샘플 데이터로 동작한다 (weatherStore 폴백).
        env:
          VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
          # GitHub Pages 는 저장소 이름 하위에서 서비스된다 (Vercel 은 루트라 이 값이 없다)
          VITE_BASE_PATH: /skala-vue/
        run: npm run build

      # 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 한 번 켜 두면
      # 이 스텝이 base path 등 Pages 설정을 읽어 온다.
      # (enablement: true 는 GITHUB_TOKEN 권한으로 Pages 사이트를 만들 수 없어 실패한다)
      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
